<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="actions"><button value="no" class="btn secondary">Keep shipment</button><button value="yes" class="btn danger">Cancel shipment</button></div></form></dialog>
  <script>/* Browser-only demonstration. No real account, payment or carrier request. */
(function(root){
  'use strict';
  const providers=[
    {id:'dtdc',name:'DTDC',category:'domestic',fee:999,service:'Domestic Standard',days:4,base:95,kg:45},
    {id:'delhivery',name:'Delhivery',category:'domestic',fee:1299,service:'Domestic Express',days:2,base:145,kg:65},
    {id:'dhl',name:'DHL',category:'international',fee:2499,service:'International Express',days:5,base:1700,kg:550},
  ];
  const now=()=>new Date().toISOString();
  const clone=v=>JSON.parse(JSON.stringify(v));
  const id=prefix=>prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
  const assert=(ok,message)=>{if(!ok)throw Error(message);};
  function fresh(){return {version:2,company:{name:'Chandhu Logistics',email:'company@chandhu.demo',phone:'9876543210',categories:'both'},session:{role:'company',branchId:'HYD'},branches:[{id:'HYD',name:'Hyderabad Central',type:'own',city:'Hyderabad',country:'India',pin:'500016',prefix:'500',address:'Ameerpet Main Road'},{id:'VJA',name:'Vijayawada Franchise',type:'franchise',city:'Vijayawada',country:'India',pin:'520010',prefix:'520',address:'Benz Circle'},{id:'DXB',name:'Dubai Franchise',type:'franchise',city:'Dubai',country:'United Arab Emirates',pin:'00000',prefix:'00000',address:'Al Quoz (demo address)'}],team:[{id:'U1',name:'Chandhu',email:'admin@chandhu.demo',role:'superadmin',branchId:''},{id:'U2',name:'Anil',email:'vja@chandhu.demo',role:'branchadmin',branchId:'VJA'}],purchases:[{id:'PLAN-1',amount:5000,bookings:10000,date:now(),kind:'booking-pack'}],allocations:[{id:'AL-1',branchId:'VJA',bookings:1000,amount:2500,note:'Company-entered commercial reference; settlement outside platform.',date:now()},{id:'AL-2',branchId:'DXB',bookings:500,amount:4000,note:'Opening allowance',date:now()}],services:{dtdc:{paid:true,connected:true,account:'Chandhu demo account'}},servicePayments:[{providerId:'dtdc',amount:999,date:now()}],shipments:[],ledger:[],draft:null};}
  function seed(){const s=fresh();for(const [num,branch,destination,stage] of [[1001,'VJA','Hyderabad',0],[1002,'HYD','Vijayawada',1]]){const b=s.branches.find(b=>b.id===branch);const d=makeDraft(s,branch);Object.assign(d,{city:destination,pin:destination==='Hyderabad'?'500016':'520010',receiver:'Demo Receiver '+num,detailsComplete:true});d.coverage=coverage(s,d);d.service=quotes(s,d)[0];const booking=confirm(s,d,'success');booking.id='CN-'+num;const old=s.ledger.at(-1);old.shipmentId=booking.id;booking.stage=stage;if(stage)booking.events.push({stage,date:now(),note:'Loaded at origin branch'});}return s;}
  const companyRole=s=>['company','superadmin'].includes(s.session?.role);
  const branch=s=>s.branches.find(b=>b.id===s.session?.branchId);
  function categories(s){return s.company.categories==='both'?['domestic','international']:[s.company.categories];}
  function companyQuota(s){const purchased=s.purchases.reduce((n,p)=>n+p.bookings,0);const used=s.ledger.reduce((n,e)=>n+(e.action==='consume'?1:-1),0);const held=s.shipments.filter(b=>b.confirmation==='pending').length;return {purchased,used,held,remaining:purchased-used,available:purchased-used-held};}
  function branchQuota(s,branchId){const b=s.branches.find(b=>b.id===branchId);if(!b||b.type!=='franchise')return null;const allocated=s.allocations.filter(a=>a.branchId===branchId).reduce((n,a)=>n+a.bookings,0);const used=s.ledger.filter(e=>e.branchId===branchId).reduce((n,e)=>n+(e.action==='consume'?1:-1),0);const held=s.shipments.filter(b=>b.originId===branchId&&b.confirmation==='pending').length;return {allocated,used,held,remaining:allocated-used,available:allocated-used-held};}
  function ensureQuota(s,branchId){assert(companyQuota(s).available>0,'Company booking quota exhausted. Company admin must purchase an additional pack. Existing shipments can continue.');const q=branchQuota(s,branchId);assert(!q||q.available>0,'Franchise allowance exhausted. Ask the company admin to add an allowance.');}
  function makeDraft(s,originId){const b=s.branches.find(b=>b.id===originId)||branch(s)||s.branches.find(b=>b.country==='India')||s.branches[0];return {category:categories(s)[0],originId:b?.id||'',sender:'Suresh Reddy',senderMobile:'9876543210',receiver:'Anil Kumar',receiverMobile:'9876501234',address:'24 MG Road, Benz Circle',city:'Vijayawada',country:'India',pin:'520010',contents:'Garments',quantity:1,weight:2,length:30,width:20,height:15,value:2500,paymentType:'Paid',collectionMethod:'Cash',creditParty:'',purpose:'Commercial goods',invoice:'INV-101',hsCode:'610910',duties:'Recipient',documents:false,detailsComplete:false,customsComplete:false,coverage:null,service:null};}
  function coverage(s,d){const origin=s.branches.find(b=>b.id===d.originId);const destination=s.branches.find(b=>b.country===d.country&&b.city.trim().toLowerCase()===d.city.trim().toLowerCase()&&String(d.pin).replace(/\s/g,'').startsWith(b.prefix));return {originId:origin?.id||null,destinationId:destination?.id||null,own:!!origin&&!!destination&&origin.id!==destination.id,reason:origin&&destination&&origin.id!==destination.id?'Both ends are served by the company network. Own and franchise branches are included where coverage is configured.':'No complete own-network route for these addresses. Use an enabled, connected external service.'};}
  function enabled(s,p){return !!s.services[p.id]?.paid&&!!s.services[p.id]?.connected&&categories(s).includes(p.category);}
  function quotes(s,d){const weight=Math.max(+d.weight,(+d.length*+d.width*+d.height)/5000)*(+d.quantity);const list=d.coverage?.own?[{id:'own',name:s.company.name+' · Own logistics',service:d.category==='international'?'Overseas branch route':'Branch route',days:d.category==='international'?6:3,base:d.category==='international'?1200:100,kg:d.category==='international'?300:35}]:providers.filter(p=>p.category===d.category&&enabled(s,p));return list.map(p=>{const freight=Math.ceil(p.base+p.kg*weight),tax=Math.round(freight*.18);return {...p,freight,tax,total:freight+tax,weight};});}
  function checkDraft(s,d){assert(categories(s).includes(d.category),'This shipment category is not enabled by the company.');const origin=s.branches.find(b=>b.id===d.originId);assert(origin,'Choose a company branch.');assert(companyRole(s)||d.originId===s.session.branchId,'Staff can only create bookings for their assigned branch.');assert(d.category!=='domestic'||origin.country==='India'&&d.country==='India','Domestic demo bookings must be within India.');assert(d.category!=='international'||origin.country!==d.country,'International bookings need different origin and destination countries.');assert([d.sender,d.senderMobile,d.receiver,d.receiverMobile,d.address,d.city,d.pin,d.contents].every(v=>typeof v==='string'&&v.trim()),'Complete the required booking fields.');assert([d.quantity,d.weight,d.length,d.width,d.height,d.value].every(v=>Number.isFinite(+v)&&+v>0),'Parcel quantity, weight, dimensions and value must be positive.');assert(Number.isSafeInteger(+d.quantity),'Package quantity must be a whole number.');const c=coverage(s,d);assert(d.coverage&&c.own===d.coverage.own&&c.destinationId===d.coverage.destinationId,'Address details changed. Check coverage again.');assert(quotes(s,d).some(q=>q.id===d.service?.id),'Selected service is no longer available. Recheck services.');if(d.category==='international')assert(d.customsComplete&&d.documents&&d.invoice.trim()&&/^\d{6,10}$/.test(d.hsCode),'Complete customs details and required documents.');assert(['Paid','To Pay','Credit','FOC'].includes(d.paymentType),'Choose a valid freight type.');assert(d.service.id==='own'||d.paymentType==='Paid','The external demo supports prepaid freight only.');assert(d.paymentType!=='Credit'||d.creditParty.trim(),'Enter a credit party.');}
  function consume(s,b){if(s.ledger.some(e=>e.shipmentId===b.id&&e.action==='consume'))return;s.ledger.push({id:id('Q'),shipmentId:b.id,branchId:b.originId,action:'consume',date:now(),note:'Successful booking'});}

  function confirm(s,d,outcome='success'){checkDraft(s,d);ensureQuota(s,d.originId);assert(['success','pending','failed'].includes(outcome),'Invalid demo result.');const number=Math.max(1000,...s.shipments.map(b=>+b.id.slice(3)))+1;const b={...clone(d),id:'CN-'+number,service:clone(quotes(s,d).find(q=>q.id===d.service.id)),mode:d.service.id==='own'?'own':'external',date:now(),confirmation:outcome==='success'?'confirmed':outcome,stage:0,cancelled:false,cancelPending:false,refund:'none',freight:d.paymentType==='FOC'?0:d.service.total,collected:0,events:[]};if(outcome==='success'){b.collected=d.paymentType==='Paid'?b.freight:0;b.events.push({stage:0,date:now(),note:'Booking confirmed'});consume(s,b);}s.shipments.unshift(b);return b;}
  const stages=b=>b.mode==='own'?['Booked','Loaded','In transit','Unloaded','Delivered']:['Booked','Pickup scheduled','Picked up','In transit','Out for delivery','Delivered'];
  const status=b=>b.cancelled?'Cancelled':b.cancelPending?'Cancellation pending':b.confirmation==='pending'?'Confirmation pending':b.confirmation==='failed'?'Booking failed':stages(b)[b.stage];

  function requireVisible(s,b){assert(b&&visible(s).includes(b),'This shipment is outside the current branch view.');}

  function advance(s,b,details={}){requireVisible(s,b);assert(b.confirmation==='confirmed'&&!b.cancelled&&!b.cancelPending,'Shipment must be confirmed and active.');assert(b.stage<stages(b).length-1,'Shipment is already delivered.');if(b.mode==='own'){const acting=b.stage<2?b.originId:b.coverage.destinationId;assert(companyRole(s)||s.session.branchId===acting,'Switch to the responsible origin / destination branch for this operation.');if(b.stage===0)assert(details.vehicle?.trim()&&details.driver?.trim(),'Enter vehicle and driver details.');if(b.stage===2)assert(details.receivingStaff?.trim(),'Enter receiving staff.');if(b.stage===3){assert(details.receiver?.trim()&&details.phone?.trim(),'Enter receiver confirmation.');assert(Number.isFinite(+details.amount)&&+details.amount>=0,'Enter a valid collected amount.');assert(b.paymentType!=='To Pay'||+details.amount===b.freight,'Collect the full To Pay freight before delivery.');b.collected+=+details.amount;}}Object.assign(b,{operationDetails:{...(b.operationDetails||{}),...details}});b.stage++;b.events.push({stage:b.stage,date:now(),note:stages(b)[b.stage]+' · '+(details.notes||'Demo operational update')});}
  function allocate(s,data){assert(companyRole(s),'Only company / company super admin can allocate allowance.');const b=s.branches.find(b=>b.id===data.branchId);assert(b?.type==='franchise','Choose a franchise branch.');assert(Number.isSafeInteger(+data.bookings)&&+data.bookings>0,'Enter a positive whole booking allowance.');assert(Number.isFinite(+data.amount)&&+data.amount>=0,'Enter a non-negative reference amount.');s.allocations.unshift({id:id('AL'),branchId:b.id,bookings:+data.bookings,amount:+data.amount,note:data.note||'',date:now()});}

  <script>(function(){
  'use strict';

  const link=(text,path,style='')=>`<a class="btn ${style}" href="#/${path}">${text}</a>`;

  const badge=(text,tone='')=>`<span class="badge ${tone}">${esc(text)}</span>`;
  const notice=(title,text,tone='')=>`<div class="notice ${tone}"><strong>${title}</strong>${text}</div>`;

  function go(p){if(location.hash==='#/'+p)render();else location.hash='/'+p;}
  const workflow=()=>`<div class="workflow">${[['company','01','Company setup'],['subscription','02','Subscription'],['branches','03','Branches & team'],['services','04','Connect services'],['book/new','05','Create booking'],['reports','06','Review reports']].map(([p,n,t])=>`<a href="#/${p}"><small>STEP ${n}</small>${t} →</a>`).join('')}</div>`;
  const companyNav=[['dashboard','Dashboard'],['company','Company settings'],['subscription','Subscription & quota'],['branches','Branches & franchises'],['team','Admins & staff'],['services','External services']];
  const operationNav=[['book/new','New booking'],['bookings','All bookings'],['operations','Own logistics operations'],['tracking','Courier tracking'],['reports','Reports']];
  function shell(body,active='dashboard',crumb='Overview'){
    const q=D.companyQuota(state),b=D.branch(state);
    const roles=`<option value="company" ${state.session.role==='company'?'selected':''}>Company owner</option><option value="superadmin" ${state.session.role==='superadmin'?'selected':''}>Company super admin</option>${state.branches.map(b=>`<option value="branch:${esc(b.id)}" ${!own()&&state.session.branchId===b.id?'selected':''}>${esc(b.name)} · Staff</option>`).join('')}`;
    $('#app').innerHTML=`<div class="scrim" data-action="close-menu"></div><aside class="sidebar"><a class="brand" href="#/dashboard"><span class="brandmark">${esc(state.company.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span>${esc(state.company.name)}</span></a><div class="company-sub">Company & franchise demo</div><div class="nav-label">${own()?'Company management':'Your branch'}</div><nav>${(own()?companyNav:[['dashboard','Dashboard'],['allowance','My booking allowance'],['services','Available services']]).map(([p,t])=>`<a class="nav ${active===p?'active':''}" href="#/${p}">${t}${p==='subscription'?`<b>${num(q.available)}</b>`:''}</a>`).join('')}<div class="nav-label">Operations</div>${operationNav.map(([p,t])=>`<a class="nav ${active===p?'active':''}" href="#/${p}">${t}</a>`).join('')}</nav><div class="sidebar-bottom"><a class="nav ${active==='flow'?'active':''}" href="#/flow">Flow map & demo controls</a><div class="side-note"><b>${esc(roleLabel())}</b><br>${own()?'Manage the company and its network.':esc(b?.name||'No branch assigned')}<br>Demo data stays in this browser.</div><button class="btn ghost space" data-action="logout">Sign out →</button></div></aside><div class="main"><header class="topbar"><button class="mobile-toggle" data-action="menu" aria-label="Open navigation">☰</button><span class="crumb">${esc(state.company.name)} / ${esc(crumb)}</span><div class="top-actions"><span class="badge gray">DEMO · NO REAL PAYMENTS</span><label class="staffbadge">View as <select id="role-switch" aria-label="Switch demo role">${roles}</select></label></div></header><main class="content">${body}<footer class="footer"><span>${esc(state.company.name)} · Demo prototype</span><span>No live carrier request or real payment · 11 Nov 2026</span></footer></main></div>`;
  }
  function bookingsTable(list){return table(['Shipment','Category / route','Origin branch','Fulfilment','Status','Freight',''],list.map(b=>[`<strong>${esc(b.id)}</strong><small>${date(b.date)}</small>`,`${esc(b.category)}<br><small>${esc(state.branches.find(x=>x.id===b.originId)?.city)} → ${esc(b.city)}</small>`,esc(branchName(b.originId)),`${b.mode==='own'?'Own logistics':esc(b.service.name)}<br><small>${b.mode==='own'?'GRN / LR':'AWB'}-${b.id.slice(3)}</small>`,badge(D.status(b),b.cancelled||b.confirmation!=='confirmed'?'alert':''),money(b.freight),`<a class="tablelink" href="#/shipment/${b.id}">Open →</a>`]));}
  function dashboard(){const q=D.companyQuota(state),fq=D.branchQuota(state,state.session.branchId),list=D.visible(state);const active=list.filter(b=>b.confirmation==='confirmed'&&!b.cancelled&&D.status(b)!=='Delivered');shell(head(own()?'Your company, connected.':'Your branch workspace.',own()?'Set up branches and services, allocate franchise bookings and manage every shipment.':'Create bookings using your parent company’s categories and connected services.',link('New booking','book/new'))+(own()?workflow():notice('Inherited from '+esc(state.company.name),'Operating categories: '+esc(state.company.categories)+'. Courier services are purchased and enabled by your parent company.'))+`<div class="stats">${stat('Company available bookings',num(q.available),`${num(q.purchased)} purchased · ${q.held} pending holds`)}${stat(fq?'Your franchise allowance':'Confirmed bookings',fq?num(fq.available):num(q.used),fq?`${num(fq.allocated)} allocated · ${fq.used} used`:'Net quota consumed after restorations')}${stat('Active shipments',num(active.length),'Existing shipments continue even when quota ends')}${stat(own()?'Company branches':'Delivered shipments',own()?num(state.branches.length):num(list.filter(b=>D.status(b)==='Delivered').length),own()?`${state.branches.filter(b=>b.type==='franchise').length} franchise branches`:'In your permitted branch view')}</div>`+(q.available<=0?notice('Company booking quota exhausted','New bookings are stopped. Existing shipment operations remain available. '+(own()?'<a class="tablelink" href="#/subscription">Purchase another pack →</a>':'Contact your company admin.'),'warn'):q.available<=100?notice('Company quota running low','Company admin should purchase a booking pack before the remaining quota is exhausted.','warn'):'')+`<div class="grid2"><section class="card pad"><h2>Company offering</h2>${kv('Categories',esc(state.company.categories))}${kv('Connected services',D.providers.filter(p=>D.enabled(state,p)).map(p=>p.name).join(', ')||'None')}${kv('Company available / pending holds',`${num(q.available)} / ${q.held}`)}<div class="buttonbar">${link(own()?'Manage services':'View available services','services','secondary')}${link('See the full flow','flow','secondary')}</div></section><section class="card pad"><h2>Try a booking journey</h2><p class="subtitle">Sample addresses are editable. All quotes and provider responses are illustrative.</p><div class="buttonbar">${btn('Domestic · Own','sample:domestic-own','secondary small')}${btn('Domestic · Courier','sample:domestic-external','secondary small')}${btn('International · Own','sample:international-own','secondary small')}${btn('International · Courier','sample:international-external','secondary small')}</div></section></div><section class="card"><div class="cardhead"><h2>Recent bookings</h2><a class="tablelink" href="#/bookings">View all →</a></div>${bookingsTable(list.slice(0,6))}</section>`,'dashboard');}

  function auth(register=false){$('#app').innerHTML=`<main class="login"><header><div class="eyebrow">Company logistics demo</div><h1>${register?'Register your logistics company':'Company & staff sign-in'}</h1><p class="subtitle">Explore the full flow using dummy details. No real account is created.</p></header><div class="tabs"><a class="tab ${!register?'active':''}" href="#/login">Login</a><a class="tab ${register?'active':''}" href="#/register">Company registration</a></div><form id="${register?'register-form':'login-form'}" class="card"><div class="formsection"><div class="fields">${register?field('Company name','name','Chandhu Logistics')+field('Phone','phone','9876543210',{type:'tel'}):select('Login type','loginType','company',[['company','Company login'],['superadmin','Company super admin'],...state.branches.map(b=>['branch:'+b.id,b.name+' staff'])])}${field(register?'Company email':'Email','email',register?'company@chandhu.demo':state.company.email,{type:'email'})}${field('Demo password','password','demo1234',{type:'password',min:8})}</div>${register?'<p class="login-note">Registration creates an empty company demo: no booking pack, branches or external services. The current demo data will be replaced when you submit.</p>':'<p class="login-note">Any valid demo email and 8+ character password works. Switch roles after login to explore branch/franchise permissions.</p>'}${formError()}</div><div class="formfooter">${link('Open existing company demo','dashboard','secondary')}<button class="btn" type="submit">${register?'Register company':'Login'} →</button></div></form>${notice('Start-to-finish preview','Registration → Company login → Company categories → Subscription → Branches/admins → External services → Staff booking → Operations → Reports.')}<div class="actions">${btn('Restore prepared demo','reset','secondary')}</div></main>`;}
  function settings(){shell(head('Company settings','Choose what your company provides. The same categories apply to every own and franchise branch.',link('Next: Subscription','subscription','secondary'),'Company setup')+`<form class="card" id="company-form"><div class="formsection"><h3>Company details</h3><div class="fields">${field('Company name','name',state.company.name)}${field('Contact email','email',state.company.email,{type:'email'})}${field('Phone','phone',state.company.phone,{type:'tel'})}${select('Operating categories','categories',state.company.categories,[['domestic','Domestic only'],['international','International only'],['both','Domestic + International']])}</div><div class="space">${notice('Company-wide offering','Branches cannot independently enable a category or courier service that the parent company does not provide. Changing this setting affects new bookings; existing shipments remain visible.')}</div>${formError()}</div><div class="formfooter"><small>Branding and reports use your company name.</small><button class="btn">Save company settings</button></div></form>`,'company','Company settings');}
  function subscription(){const q=D.companyQuota(state);shell(head('Subscription & booking quota','Ciyash supplies the booking pack. All company and franchise bookings count toward the same purchased quota.',link('Next: Branches','branches','secondary'),'Subscription')+`<div class="stats">${stat('Purchased',num(q.purchased),'Booking pack totals')}${stat('Net used',num(q.used),'Successful bookings minus restored cancellations')}${stat('Pending holds',num(q.held),'Held while provider confirmation is pending')}${stat('Available',num(q.available),'Can be used for new bookings')}</div>`+notice('Quota-based demo assumption','Pack expiry and service fee validity are still business decisions. This demo adds booking quota without expiry; these example prices are not final commercial terms.')+`<div class="grid2">${[[5000,10000],[1000,2000]].map(([amount,bookings])=>`<section class="card pad"><span class="badge gray">Ciyash booking pack · Example</span><h2 class="space">${num(bookings)} bookings</h2><p class="subtitle">${money(amount)} · Shared by all own/franchise branches.</p><div class="buttonbar">${link('Review & demo purchase',`pack/${bookings}`)}</div></section>`).join('')}</div><section class="card"><div class="cardhead"><h2>Subscription purchases</h2></div>${table(['Reference','Date','Amount','Bookings added'],state.purchases.map(p=>[esc(p.id),date(p.date),money(p.amount),num(p.bookings)]))}</section><section class="card pad"><h3>What happens when limits end?</h3><p class="subtitle">Company quota exhausted: all new bookings stop until a pack is purchased. Franchise allowance exhausted: only that franchise stops until the company adds allowance. Existing shipments can still load, move and deliver.</p></section>`,'subscription','Subscription');}

  function branches(){shell(head('Branches & franchises','Company owner or company super admin creates branches and provides access.',link('Create branch','branch/new'))+`<section class="card">${table(['Branch','Type','Country / City','Postal coverage','Franchise allowance',''],state.branches.map(b=>{const q=D.branchQuota(state,b.id);return [`<strong>${esc(b.name)}</strong><small>${esc(b.id)}</small>`,badge(b.type),`${esc(b.country)}<br><small>${esc(b.city)}</small>`,esc(b.prefix)+'…',q?`${num(q.available)} available<br><small>${num(q.allocated)} allocated · ${q.used} used</small>`:'Uses company quota',`<a class="tablelink" href="#/branch/${b.id}">Manage →</a>`];}))}</section>`+notice('Franchise commercial terms','Enter the amount/reference and booking allowance agreed by your company. How the franchise paid you outside this platform is not processed here.')+link('Next: Create admins & staff','team','secondary'),'branches','Branches');}
  function newBranch(){shell(head('Create a branch','Choose an own branch or franchise branch. Both remain under your company name.','','Branch management')+`<form id="branch-form" class="card"><div class="formsection"><h3>Branch details</h3><div class="fields">${field('Branch name','name','')}${select('Branch type','type','own',[['own','Own branch'],['franchise','Franchise branch']])}${select('Country','country','India',['India','United Arab Emirates','United Kingdom','United States'])}${field('City','city','')}${field('Postal / PIN code','pin','')}${field('Served postal prefix','prefix','',{help:'Demo coverage matches country + city + this prefix. Dubai demo uses 00000 only as a placeholder.'})}${field('Address','address','',{full:true})}</div></div><div class="formsection" id="franchise-fields" hidden><h3>Initial franchise allowance</h3><div class="fields">${field('Reference amount (INR)','amount',0,{type:'number',min:0,step:.01,required:false})}${field('Bookings to allocate','bookings',0,{type:'number',min:0,step:1,required:false})}</div><p class="scope">Optional at branch creation. Add more allowance later. Allocation does not deduct company quota.</p></div><div class="formsection">${formError()}${notice('Next step','After saving, create a branch admin/staff account from Admins & staff. Franchise staff cannot create branches.')}</div><div class="formfooter">${link('Back','branches','secondary')}<button class="btn">Create branch</button></div></form>`,'branches','Create branch');}
  function branchDetails(id){const b=state.branches.find(b=>b.id===id);if(!b){go('branches');return;}const q=D.branchQuota(state,id);shell(head(esc(b.name),`${esc(b.type)} branch under ${esc(state.company.name)}`,link('All branches','branches','secondary'))+`<div class="grid2"><section class="card pad"><h2>Branch details</h2>${kv('Branch ID',esc(b.id))}${kv('Type',esc(b.type))}${kv('City / Country',esc(b.city)+' / '+esc(b.country))}${kv('Address',esc(b.address))}${kv('Postal prefix',esc(b.prefix))}<div class="buttonbar">${link('Create branch staff','team/new','secondary')}${btn('View as this branch',`viewbranch:${id}`,'secondary')}</div></section><section class="card pad"><h2>${q?'Franchise allowance':'Company quota access'}</h2>${q?kv('Allocated',num(q.allocated))+kv('Used',num(q.used))+kv('Pending holds',num(q.held))+kv('Available',num(q.available)):kv('Available company quota',num(D.companyQuota(state).available))}<p class="scope">${q?'Company quota must also be available. Franchise allowance can exceed the company balance; actual bookings cannot.':'Own branch bookings consume only the shared company quota.'}</p></section></div>`+(q?`<form id="allocation-form" class="card" data-branch="${id}"><div class="cardhead"><h2>Add franchise allowance</h2></div><div class="formsection"><div class="fields">${field('Bookings to add','bookings',100,{type:'number',min:1,step:1})}${field('Commercial reference amount (INR)','amount',0,{type:'number',min:0,step:.01})}${field('Reference / note','note','',{required:false,full:true})}</div>${formError()}</div><div class="formfooter"><small>Records your terms; does not process a franchise payment.</small><button class="btn">Add allowance</button></div></form><section class="card"><div class="cardhead"><h2>Allocation history</h2></div>${table(['Date','Reference amount','Bookings added','Note'],state.allocations.filter(a=>a.branchId===id).map(a=>[date(a.date),money(a.amount),num(a.bookings),`<span class="wrap">${esc(a.note)}</span>`]))}</section>`:''),'branches','Branch details');}
  function allowance(){const b=D.branch(state),q=D.branchQuota(state,b?.id);shell(head('My booking allowance','Your company controls booking access. Contact the company admin for an allowance top-up.')+`<div class="stats">${stat('Company available',num(D.companyQuota(state).available),'Required for every booking')}${stat('Branch allocated',q?num(q.allocated):'Shared',q?'Franchise allowance':'Own branch uses company quota')}${stat('Branch used',q?num(q.used):'—','Net successful bookings')}${stat('Branch available',q?num(q.available):num(D.companyQuota(state).available),'Pending holds excluded')}</div>`+notice('Two checks before a franchise booking','The franchise allowance and company purchased quota must both be available. Your company’s commercial amount is an allocation reference; it is not a wallet that is automatically deducted by freight cost.')+`<section class="card"><div class="cardhead"><h2>Your allowance entries</h2></div>${table(['Date','Amount reference','Bookings added'],state.allocations.filter(a=>a.branchId===b?.id).map(a=>[date(a.date),money(a.amount),num(a.bookings)]))}</section>`,'allowance','Allowance');}
  function team(){shell(head('Admins & staff','Your company creates the accounts and assigns branches. No separate franchise registration.',link('Create account','team/new'))+`<section class="card">${table(['Name','Email','Role','Branch'],state.team.map(u=>[esc(u.name),esc(u.email),badge(u.role),u.branchId?esc(branchName(u.branchId)):'Company-wide']))}</section>`+link('Next: Connect services','services','secondary'),'team','Team');}
  function newStaff(){shell(head('Create admin / staff','Company super admin is your logistics company’s admin, not a Ciyash operational account.')+`<form id="team-form" class="card"><div class="formsection"><div class="fields">${field('Name','name','')}${field('Demo email','email','',{type:'email'})}${select('Role','role','branchadmin',[['superadmin','Company super admin'],['branchadmin','Branch admin'],['staff','Branch staff']])}${select('Assigned branch','branchId',state.branches[0]?.id||'',[['','No branch — company-wide'],...state.branches.map(b=>[b.id,b.name])])}${field('Temporary demo password','password','demo1234',{type:'password',min:8,help:'Not stored in this demo.'})}</div>${formError()}</div><div class="formfooter">${link('Back','team','secondary')}<button class="btn">Create demo account</button></div></form>`,'team','Create account');}
  function services(){shell(head(own()?'External services':'Company-enabled services',own()?'Purchase service enablement, then connect the demo account. Your branches inherit the same service access.':'Your company decides which external services are available. Franchise staff cannot independently purchase services.',own()?link('Next: New booking','book/new','secondary'):'' )+notice('Provider names are examples','All enablement fees, quotes and connections here are dummy values. No credentials, API request or real payment is sent. Fee validity remains a business decision.')+`<div class="grid3">${D.providers.map(p=>{const e=state.services[p.id]||{},cat=D.categories(state).includes(p.category);return `<section class="card pad"><div class="row"><h2>${p.name}</h2>${badge(p.category,'gray')}</div><p class="subtitle">${p.service}</p>${kv('Ciyash enablement fee',money(p.fee))}${kv('Company entitlement',e.paid?'Purchased':'Not purchased')}${kv('Connection',e.connected?'Connected':'Not connected')}<div class="buttonbar">${own()?!e.paid?link('View fee & purchase',`service/${p.id}/purchase`):link(e.connected?'Manage connection':'Connect service',`service/${p.id}/connect`,'secondary'):badge(D.enabled(state,p)?'Available for booking':'Not available','gray')}</div>${!cat?'<p class="scope">Company category setting currently disables this service for new bookings.</p>':''}${e.connected&&e.account?'<p class="scope">Account: '+esc(e.account)+'</p>':''}</section>`;}).join('')}</div>`+(own()?`<section class="card"><div class="cardhead"><h2>Service enablement fees</h2></div>${table(['Date','Service','Demo fee'],state.servicePayments.map(p=>[date(p.date),esc(D.providers.find(x=>x.id===p.providerId)?.name),money(p.amount)]))}</section>`:''),'services','External services');}
  function serviceDetail(id,step){const p=D.providers.find(p=>p.id===id);if(!p){go('services');return;}const e=state.services[id]||{};if(step==='connect'&&!e.paid){go(`service/${id}/purchase`);return;}shell(head(step==='purchase'?`Enable ${p.name}`:`Connect ${p.name}`,'Company-enabled service access is shared with all own and franchise branches.',link('Back to services','services','secondary'))+`<form id="service-${step==='purchase'?'purchase':'connect'}-form" class="card" data-provider="${p.id}"><div class="formsection"><h2>${p.name} · ${p.category}</h2>${kv('Example Ciyash enablement fee',money(p.fee))}${kv('Company',esc(state.company.name))}${step==='purchase'?notice('Fee and freight are separate','This fee enables the external service for your company. Each shipment’s courier quote / customer freight is recorded separately. This is a one-off demo entitlement; final fee validity is not decided.'):field('Demo account label','account',e.account||state.company.name+' demo account',{help:'Use a label only. Do not enter real API keys or credentials.'})}<div class="space"><label class="check"><input type="checkbox" required> ${step==='purchase'?'Confirm simulated service purchase; no real charge.':'Connect a simulated account; no API request.'}</label></div>${formError()}</div><div class="formfooter">${link('Back','services','secondary')}<button class="btn">${step==='purchase'?'Confirm demo payment → Connect':'Connect demo service'}</button></div></form>`,'services',step==='purchase'?'Service fee':'Connect service');}

  function startBooking(){if(!state.draft)state.draft=D.makeDraft(state,own()?state.branches.find(b=>b.country==='India')?.id:state.session.branchId);bookingDetails();}
  function bookingSteps(current){const all=state.draft?.category==='international'?['details','coverage','services','customs','review']:['details','coverage','services','review'];const i=all.indexOf(current);return `<div class="steps">${all.map((t,n)=>`<div class="step ${i===n?'active':n<i?'done':''}">${n+1}. ${t[0].toUpperCase()+t.slice(1)}</div>`).join('')}</div>`;}
  function bookingSummary(){const d=state.draft,s=d.service,q=D.companyQuota(state),fq=D.branchQuota(state,d.originId);return `<aside class="card pad summary"><h3>Booking summary</h3>${kv('Category',esc(d.category))}${kv('Origin branch',esc(branchName(d.originId)))}${kv('Destination',esc(d.city)+', '+esc(d.country))}${kv('Packages',d.quantity+' × '+d.weight+' kg')}${s?kv('Service',s.id==='own'?'Own logistics':esc(s.name))+kv('Demo freight',money(s.freight))+kv('Demo tax (18%)',money(s.tax))+kv('Total quote',`<span class="total">${money(s.total)}</span>`):''}<div class="blankline"></div>${kv('Company available',num(q.available))}${fq?kv('Franchise available',num(fq.available)):''}<p class="scope">One successful booking consumes one company count and, for a franchise, one branch count. No count is consumed by filling this form.</p></aside>`;}
  function wizard(body,step){shell(head('New '+(state.draft.category==='international'?'international':'domestic')+' booking','Staff enters the customer’s details. Only essential existing CRM fields are used.',link('Exit booking','bookings','secondary'),'Booking flow')+bookingSteps(step)+`<div class="layout"><div>${body}</div>${bookingSummary()}</div>`,'book/new','New booking / '+step);}
  function bookingDetails(){const d=state.draft;if(!state.branches.length){shell(head('Create your first branch','A company branch is needed before staff can book shipments.')+`<section class="card">${empty('No branches yet','Create an own or franchise branch, then create its staff accounts.',own()?link('Create branch','branch/new'):'Contact your company admin.')}</section>`,'book/new');return;}if(!own())d.originId=state.session.branchId;wizard(`<form id="booking-details-form" class="card"><div class="cardhead"><div><h2>Addresses & parcel</h2><p>Short form for understanding navigation. More CRM fields can be added later.</p></div></div><div class="formsection"><h3>Route</h3><div class="fields">${select('Shipment category','category',d.category,D.categories(state).map(c=>[c,c==='domestic'?'Domestic':'International']))}${select('Booking branch','originId',d.originId,(own()?state.branches:state.branches.filter(b=>b.id===state.session.branchId)).map(b=>[b.id,b.name]))}${select('Destination country','country',d.country,['India','United Arab Emirates','United Kingdom','United States'])}${field('Destination city','city',d.city)}${field('Destination postal / PIN code','pin',d.pin)}${field('Delivery address','address',d.address)}</div></div><div class="formsection"><h3>Sender & receiver</h3><div class="fields">${field('Sender name','sender',d.sender)}${field('Sender mobile','senderMobile',d.senderMobile,{type:'tel',pattern:'[+0-9() -]{7,20}'})}${field('Receiver name','receiver',d.receiver)}${field('Receiver mobile','receiverMobile',d.receiverMobile,{type:'tel',pattern:'[+0-9() -]{7,20}'})}</div></div><div class="formsection"><h3>Parcel</h3><div class="fields three">${field('Contents','contents',d.contents)}${field('Packages','quantity',d.quantity,{type:'number',min:1,max:100,step:1})}${field('Weight per package (kg)','weight',d.weight,{type:'number',min:.1,max:100,step:.1})}${field('Length (cm)','length',d.length,{type:'number',min:1,max:200,step:1})}${field('Width (cm)','width',d.width,{type:'number',min:1,max:200,step:1})}${field('Height (cm)','height',d.height,{type:'number',min:1,max:200,step:1})}${field('Declared goods value (INR)','value',d.value,{type:'number',min:1,max:10000000,step:.01})}</div>${formError()}<p class="scope">Own route coverage uses branch country, city and served postal prefix in this demo. No live geocoding is performed.</p></div><div class="formfooter">${btn('Discard draft','discard','secondary')}<button class="btn">Check company branch coverage →</button></div></form>`,'details');}
  function coveragePage(){const d=state.draft,c=d.coverage,origin=state.branches.find(b=>b.id===c.originId),dest=state.branches.find(b=>b.id===c.destinationId);wizard(`<section class="card"><div class="coverage-result"><span class="badge gray">Coverage check complete</span><h2 class="space">${c.own?'Use your company branch network.':'Use a connected external service.'}</h2><p>${esc(c.reason)}</p></div><div class="formsection"><div class="route"><div><small>ORIGIN</small><strong>${esc(origin?.name||'Not found')}</strong><small>${esc(origin?.city)} · ${esc(origin?.type)}</small></div><span>→</span><div><small>DESTINATION</small><strong>${esc(dest?.name||d.city)}</strong><small>${dest?esc(dest.type)+' branch':'No complete own-network route'}</small></div></div>${notice('Next page',c.own?'Select the own-company route and review its demo freight.':'View only company-enabled, connected external services for this category. If none are available, the company must purchase/connect a service first.')}</div><div class="formfooter">${link('Edit addresses','book/details','secondary')}${link(c.own?'View own route →':'View courier services →','book/services')}</div></section>`,'coverage');}
  function servicesPage(){const d=state.draft;let quotes=D.quotes(state,d);quotes.sort((a,b)=>rateSort==='speed'?a.days-b.days:a.total-b.total);wizard(`<section class="card"><div class="cardhead"><div><h2>${d.coverage.own?'Own logistics route':'Connected courier options'}</h2><p>Shipping quotes are illustrative. Ciyash enablement fees are separate.</p></div>${!d.coverage.own?`<select id="rate-sort" style="width:140px" aria-label="Sort service quotes"><option value="price" ${rateSort==='price'?'selected':''}>Lowest quote</option><option value="speed" ${rateSort==='speed'?'selected':''}>Fastest estimate</option></select>`:''}</div><div class="formsection">${quotes.length?quotes.map(s=>`<button type="button" class="selectcard ${d.service?.id===s.id?'selected':''}" data-select-service="${s.id}"><span><strong>${s.id==='own'?'Own logistics':esc(s.name)}</strong><p>${esc(s.service)} · Estimated ${s.days} business days</p><div class="chiprow">${badge(s.id==='own'?'Company network':'Connected company service','gray')}${d.service?.id===s.id?badge('Selected'):''}</div></span><span><b class="price">${money(s.total)}</b><small>Demo freight + tax</small></span></button>`).join(''):empty('No enabled, connected service','Your company has not enabled a connected '+esc(d.category)+' courier. The franchise cannot enable one independently.',own()?link('Purchase / connect a service','services'):'Ask the company admin to enable a service.')}<div class="space">${notice(d.category==='international'?'International quote':'Service selection',d.category==='international'?'Customs duties and destination taxes are excluded. The next page captures international declaration/documents.':'Staff chooses a service on the customer’s behalf. The selected courier’s additional form opens next.')}</div></div><div class="formfooter">${link('Back','book/coverage','secondary')}<button class="btn" data-action="service-next" ${d.service?'':'disabled'}>${d.service?.id==='own'?'Continue':'Open selected courier form'} →</button></div></section>`,'services');}
  function courierForm(){const d=state.draft;wizard(`<form class="card" id="courier-form"><div class="cardhead"><div><h2>${esc(d.service.name)} booking form</h2><p>Common booking details are reused; only provider-specific demo fields are shown.</p></div></div><div class="formsection"><div class="fields">${field('Provider reference / order reference','providerRef',d.providerRef||'ORDER-DEMO')}${select('Pickup preference','pickupPreference',d.pickupPreference||'Pickup from booking branch',['Pickup from booking branch','Staff drop-off at courier'])}${field('Handling notes','handlingNotes',d.handlingNotes||'',{required:false,full:true})}</div><div class="space">${notice('Provider form demonstration','No DTDC, DHL or other real API form is embedded. Production adapters will validate each provider’s actual fields and serviceability.')}</div>${formError()}</div><div class="formfooter">${link('Back to services','book/services','secondary')}<button class="btn">${d.category==='international'?'Continue to customs':'Continue to review'} →</button></div></form>`,'services');}
  function customs(){const d=state.draft;wizard(`<form class="card" id="customs-form"><div class="cardhead"><div><h2>International declaration & documents</h2><p>Required for both own overseas routes and external international services.</p></div></div><div class="formsection"><div class="fields">${select('Purpose','purpose',d.purpose,['Commercial goods','Gift','Sample','Personal belongings'])}${field('HS code','hsCode',d.hsCode,{pattern:'[0-9]{6,10}'})}${field('Invoice reference','invoice',d.invoice)}${select('Duties responsibility','duties',d.duties,['Recipient','Sender'])}</div><div class="space">${notice('Required document references','This simplified demo uses sample invoice and sender identity references. No real document upload or compliance check is performed.')}</div><label class="check"><input name="documents" type="checkbox" ${d.documents?'checked':''} required> Attach sample invoice + sender identity references to this demo booking.</label><p class="scope">Declared goods value: ${money(d.value)}. Duties and destination taxes are separate from shipping freight.</p>${formError()}</div><div class="formfooter">${link('Back',d.service.id==='own'?'book/services':'book/courier','secondary')}<button class="btn">Review booking →</button></div></form>`,'customs');}
  function review(){const d=state.draft,fq=D.branchQuota(state,d.originId),q=D.companyQuota(state);wizard(`<form id="review-form" class="card"><div class="cardhead"><h2>Review & confirm</h2><a class="tablelink" href="#/book/details">Edit details</a></div><div class="formsection"><div class="grid2"><div><h3>Sender / origin</h3><p>${esc(d.sender)}<br>${esc(d.senderMobile)}<br>${esc(branchName(d.originId))}</p></div><div><h3>Receiver / delivery</h3><p>${esc(d.receiver)} · ${esc(d.receiverMobile)}<br>${esc(d.address)}<br>${esc(d.city)}, ${esc(d.country)} ${esc(d.pin)}</p></div></div><div class="blankline"></div>${kv('Selected service',d.service.id==='own'?'Own logistics':esc(d.service.name))}${kv('Contents / quantity',esc(d.contents)+' / '+d.quantity)}${d.category==='international'?kv('International declaration',esc(d.invoice)+' · HS '+esc(d.hsCode)+' · Sample docs attached'):''}</div><div class="formsection"><h3>Freight collection instructions</h3><div class="fields">${select('Freight type','paymentType',d.paymentType,d.service.id==='own'?['Paid','To Pay','Credit','FOC']:['Paid'])}${select('Collection method','collectionMethod',d.collectionMethod,['Cash','UPI','Company account'])}</div><div class="space" id="credit-party">${d.paymentType==='Credit'?field('Credit party','creditParty',d.creditParty):''}</div><p class="scope">Customer freight, courier settlement and company subscription are separate records. This demo does not process payments.</p></div>${d.service.id!=='own'?`<div class="formsection"><h3>Simulate provider response</h3>${select('Demo booking result','outcome','success',[['success','Booking confirmed'],['pending','Confirmation pending'],['failed','Booking failed']])}<p class="scope">Pending confirmation temporarily holds one quota count. Failure releases the hold; confirmed success consumes one count.</p></div>`:''}<div class="formsection">${notice('Booking quota check',`Company available: <b>${num(q.available)}</b>${fq?' · Franchise available: <b>'+num(fq.available)+'</b>':''}. Both are checked again when confirming.`)}${q.available<=0||fq&&fq.available<=0?notice('New booking blocked','Company admin must top up the applicable exhausted quota. Existing shipments remain operational.','warn'):''}<label class="check"><input type="checkbox" required> I checked the addresses, parcel, service, charges and applicable documents.</label>${formError()}</div><div class="formfooter">${link('Back',d.category==='international'?'book/customs':d.service.id==='own'?'book/services':'book/courier','secondary')}<button class="btn">Confirm demo booking</button></div></form>`,'review');}

  function bookings(){shell(head('All bookings','Company and franchise bookings stay in the same company CRM.',link('New booking','book/new'))+`<section class="card"><div class="filterbar"><input id="booking-search" aria-label="Search bookings" placeholder="Search shipment, receiver or city"><select id="booking-status" aria-label="Filter booking status"><option value="all">All statuses</option><option>Booked</option><option>Delivered</option><option>Cancelled</option><option>Confirmation pending</option><option>Booking failed</option></select></div><div id="booking-list">${bookingsTable(D.visible(state))}</div></section>`,'bookings','Bookings');}
  function success(b){shell(head(b.confirmation==='confirmed'?'Booking confirmed.':b.confirmation==='pending'?'Booking confirmation pending.':'Booking was not created by the provider.','Your record is saved in the company demo CRM.')+`<section class="card"><div class="success"><div class="checkmark">${b.confirmation==='confirmed'?'✓':'…'}</div><h2>${b.confirmation==='confirmed'?'Shipment ready for the next step':b.confirmation==='pending'?'Check provider confirmation before retrying':'No quota count consumed'}</h2><strong>${b.id}</strong><p>${esc(b.city)} · ${esc(b.service.name)}</p>${badge(D.status(b),b.confirmation==='confirmed'?'':'alert')}</div><div class="formsection">${notice('Booking count',b.confirmation==='confirmed'?'One company count and the applicable franchise count have been consumed.':b.confirmation==='pending'?'One count is reserved while confirmation is pending. Resolve the status from shipment details.':'No count was deducted. Correct the details or select a service and create a new attempt.')}<div class="actions">${link('View shipment & tracking','shipment/'+b.id)}${link('Create another booking','book/new','secondary')}${btn('Download demo receipt','download:'+b.id,'secondary')}</div></div></section>`,'bookings','Booking result');}
  function details(b){const events=b.events,steps=D.stages(b),q=D.companyQuota(state);shell(head(b.id,`${esc(branchName(b.originId))} → ${esc(b.city)} · ${esc(b.category)}`,link('All bookings','bookings','secondary')+btn('Download receipt','download:'+b.id,'secondary'))+`<div class="chiprow" style="margin-bottom:20px">${badge(D.status(b),b.confirmation!=='confirmed'||b.cancelled?'alert':'')}${badge(b.mode==='own'?'Own logistics':b.service.name,'gray')}${badge(b.category,'gray')}</div><div class="layout"><div><section class="card pad"><h2>Shipment journey</h2><div class="timeline space">${events.length?events.map((e,i)=>`<div class="event ${i===events.length-1?'current':''}"><b>${esc(e.note)}</b><p>${date(e.date)}</p></div>`).join(''):'<p class="muted">Awaiting a confirmed booking.</p>'}</div><p class="scope">Journey: ${steps.join(' → ')}</p>${b.confirmation==='pending'&&!b.cancelled&&!b.cancelPending?`<form id="reconcile-form" data-id="${b.id}" class="space"><div class="fields">${select('Provider status result','result','confirmed',[['confirmed','Provider confirmed booking'],['failed','Provider reported failure']])}</div><div class="buttonbar"><button class="btn">Check demo booking status</button></div>${formError()}</form>`:''}${b.confirmation==='confirmed'&&!b.cancelled&&!b.cancelPending&&b.stage<steps.length-1?`<div class="buttonbar">${b.mode==='own'?link('Continue own operation','operations/'+b.id):btn('Simulate: '+steps[b.stage+1],'advance-external:'+b.id)}</div>`:''}</section><section class="card pad"><h2>Booking record</h2>${kv('Company',esc(state.company.name))}${kv('Booking branch',esc(branchName(b.originId)))}${kv('Sender',esc(b.sender)+' · '+esc(b.senderMobile))}${kv('Receiver',esc(b.receiver)+' · '+esc(b.receiverMobile))}${kv('Delivery address',esc(b.address)+', '+esc(b.city)+', '+esc(b.country)+' '+esc(b.pin))}${kv('Parcel',esc(b.contents)+' · '+b.quantity+' × '+b.weight+' kg')}${kv('Reference',(b.mode==='own'?'GRN / LR-':'AWB-')+b.id.slice(3))}${b.prov   function reportBody(type){if(type==='franchise')return `<section class="card">${table(['Franchise branch','Allocated','Net used','Pending holds','Available','Commercial reference'],state.branches.filter(b=>b.type==='franchise').map(b=>{const q=D.branchQuota(state,b.id);return [`<a class="tablelink" href="#/branch/${b.id}">${esc(b.name)}</a>`,num(q.allocated),num(q.used),num(q.held),num(q.available),money(state.allocations.filter(a=>a.branchId===b.id).reduce((n,a)=>n+a.amount,0))];}))}</section>`+notice('Allowance does not reserve company quota','Only an actual booking attempt pending confirmation holds a count. Company/franchise limits are checked together on confirmation.');if(type==='quota'){const entries=state.ledger.filter(e=>own()||e.branchId===state.session.branchId);return `<section class="card">${table(['Time','Shipment','Branch','Action','Company count'],entries.map(e=>[date(e.date),`<a class="tablelink" href="#/shipment/${e.shipmentId}">${e.shipmentId}</a>`,esc(branchName(e.branchId)),badge(e.action),e.action==='consume'?'−1':'+1']))}</section>`+notice('Audit ledger','One consume per confirmed booking, at most one restore per eligible confirmed cancellation. Failed attempts are not consumed. Pending holds appear in the subscription summary.');}if(type==='finance'){const list=D.visible(state).filter(b=>b.confirmation==='confirmed'||b.cancelled);const subscriptionFee=state.purchases.reduce((n,p)=>n+p.amount,0),serviceFee=state.servicePayments.reduce((n,p)=>n+p.amount,0);return (own()?`<div class="grid3"><div class="card pad"><h3>Ciyash subscription purchases</h3><p class="space total">${money(subscriptionFee)}</p><small>Booking packs; separate from parcel freight.</small></div><div class="card pad"><h3>Ciyash external-service fees</h3><p class="space total">${money(serviceFee)}</p><small>Service entitlement; not carrier settlement.</small></div><div class="card pad"><h3>Franchise commercial references</h3><p class="space total">${money(state.allocations.reduce((n,a)=>n+a.amount,0))}</p><small>Manual entries; not platform-collected payments.</small></div></div>`:'')+`<section class="card"><div class="cardhead"><h2>Customer freight snapshot</h2></div>${table(['Shipment','Freight type','Customer charge','Collected','Refund follow-up'],list.map(b=>[`<a class="tablelink" href="#/shipment/${b.id}">${b.id}</a>`,esc(b.paymentType),money(b.freight),money(b.collected),esc(b.refund)]))}</section>`+notice('Amounts are separate','These are local demo records, not accounting transactions or revenue. Full credit-party, courier settlement and dated collection ledgers require production implementation.');}
    const list=filterList(type),pages=Math.max(1,Math.ceil(list.length/10));reportPage=Math.min(reportPage,pages);return `<section class="card"><form id="report-filter-form" class="filterbar" data-type="${type}">${field('From booking date','from',reportFilters.from,{type:'date',required:false})}${field('To booking date','to',reportFilters.to,{type:'date',required:false})}${select('Category','category',reportFilters.category,[['all','All categories'],['domestic','Domestic'],['international','International']])}${select('Fulfilment','mode',reportFilters.mode,[['all','Own + External'],['own','Own only'],['external','External only']])}${select('Booking branch','branch',reportFilters.branch,[['all','All permitted branches'],...state.branches.filter(b=>own()||b.id===state.session.branchId).map(b=>[b.id,b.name])])}${field('Search','search',reportFilters.search,{required:false})}<button class="btn">Apply</button></form><div class="pad"><div class="stats" style="margin:0">${stat('Filtered records',num(list.length),'Full filtered result, not just current page')}${stat('Delivered',num(list.filter(b=>D.status(b)==='Delivered').length),'Delivery completions in this booking cohort')}${stat('Current active',num(list.filter(b=>!b.cancelled&&b.confirmation==='confirmed'&&D.status(b)!=='Delivered').length),'For the selected booking cohort')}${stat('Customer freight',money(list.filter(b=>b.confirmation==='confirmed'&&!b.cancelled).reduce((n,b)=>n+b.freight,0)),'Active/complete confirmed shipments')}</div></div>${type==='international'?table(['Shipment','Destination','Own / Courier','Invoice / HS','Documents / Duties'],list.slice((reportPage-1)*10,reportPage*10).map(b=>[`<a class="tablelink" href="#/shipment/${b.id}">${b.id}</a>`,esc(b.country),b.mode==='own'?'Own overseas':esc(b.service.name),esc(b.invoice)+' / '+esc(b.hsCode),`${b.documents?'Sample attached':'Pending'} / ${esc(b.duties)}`])):bookingsTable(list.slice((reportPage-1)*10,reportPage*10))}<div class="pagination"><span>${list.length} records · Page ${reportPage} / ${pages}</span><div class="actions"><button class="btn secondary small" data-action="report-prev:${type}" ${reportPage<=1?'disabled':''}>Previous</button><button class="btn secondary small" data-action="report-next:${type}" ${reportPage>=pages?'disabled':''}>Next</button></div></div></section>${type==='own'?notice('Own stock and history','The table shows own-network states. Current stock can be identified by Booked / Loaded / Unloaded. Historical as-of stock reconstruction and multi-leg transfer reports are a production extension.'):''}`;

  function flow(){shell(head('The complete company flow','Use this map to move between pages and test the latest company/franchise logic.',btn('Restore sample demo','reset','secondary'))+workflow()+`<div class="grid2"><section class="card pad"><h2>Start from the beginning</h2><p class="subtitle">Company registration creates a fresh empty company. Log in, choose categories, buy quota, create branches and staff, then connect services.</p><div class="buttonbar">${link('Company registration','register')}${link('Login page','login','secondary')}</div></section><section class="card pad"><h2>Booking samples</h2><p class="subtitle">Use the prepared company data first. For external international booking, purchase/connect the example international service.</p><div class="buttonbar">${btn('Domestic own','sample:domestic-own','secondary')}${btn('Domestic courier','sample:domestic-external','secondary')}${btn('International own','sample:international-own','secondary')}${btn('International courier','sample:international-external','secondary')}</div></section></div><div class="guide">COMPANY REGISTRATION → COMPANY LOGIN

  ├─ Own branches + franchise branches
  │   └─ Company creates access + franchise allowances
  ├─ Service fee → Purchase entitlement → Connect service

      ├─ Company coverage → Own logistics route

          ↓

      Own operations / courier tracking → Delivery
          ↓
      Company reports + franchise usage + quota audit</div><div class="grid2 space"><section class="card pad"><h3>Quota and cancellation rules</h3><p class="subtitle">Allocation does not consume company quota. Confirmed success consumes one count. Failed attempts consume none. Pending attempts hold one count. Eligible confirmed cancellation restores once. Own loading / external pickup locks cancellation.</p></section><section class="card pad"><h3>Assumptions still to approve</h3><p class="subtitle">Pack expiry, external enablement validity and exact carrier cancellation cutoff. This demo uses quota packs without expiry and proposed pre-pickup provider-confirmed external cancellation.</p></section></div><section class="card pad"><h3>Try exhausted limits</h3><p class="subtitle">These controls change the local demo ledger balance only so you can check the booking guard. Restore sample demo resets everything.</p><div class="buttonbar">${btn('Simulate company quota exhausted','exhaust-company','secondary')}${btn('Simulate my franchise exhausted','exhaust-franchise','secondary')}</div></section>`,'flow','Flow map');}
  function blocked(){shell(head('Company access required','This page is managed by the company owner or company super admin.')+notice('Switch the demo role','Use “View as” at the top to return to Company owner / Company super admin.')+link('Back to dashboard','dashboard','secondary'),'dashboard');}
  function render(){const [p='dashboard',sub,third]=path();if(p==='login'||p==='register'){auth(p==='register');return;}if(!state.session){auth();return;}const protectedPages=['company','subscription','pack','branches','branch','team','service'];if(!own()&&protectedPages.includes(p)){blocked();return;}if(p==='book'){if(!state.draft){state.draft=D.makeDraft(state,own()?undefined:state.session.branchId);persist();}if(!D.categories(state).includes(state.draft.category)){state.draft=D.makeDraft(state,own()?undefined:state.session.branchId);persist();}const d=state.draft;if(!own()&&d.originId!==state.session.branchId){state.draft=D.makeDraft(state,state.session.branchId);persist();}const step=sub||'new';if(!['new','details','coverage','services','courier','customs','review'].includes(step)){go('book/new');return;}if(!['new','details'].includes(step)&&!d.detailsComplete){go('book/details');return;}if(['services','courier','customs','review'].includes(step)&&!d.coverage){go('book/coverage');return;}if(['courier','customs','review'].includes(step)&&!d.service){go('book/services');return;}if(step==='customs'&&d.category!=='international'){go('book/review');return;}if(step==='review'&&d.category==='international'&&!d.customsComplete){go('book/customs');return;}if(['new','details'].includes(step))startBooking();else ({coverage:coveragePage,services:servicesPage,courier:courierForm,customs,review})[step]();}else if(p==='shipment'||p==='success'){const b=D.visible(state).find(b=>b.id===sub);if(!b){shell(head('Shipment not found','This shipment does not exist or is outside this branch view.',link('All bookings','bookings')));return;}(p==='shipment'?details:success)(b);}else if(p==='operations')operations(sub);else if(p==='reports')reports(sub);else if(p==='branch')sub==='new'?newBranch():branchDetails(sub);else if(p==='team')sub==='new'?newStaff():team();else if(p==='service')serviceDetail(sub,third);else if(p==='pack')packReview(+sub);else({dashboard,company:settings,subscription,branches,services,allowance,bookings,tracking,flow}[p]||dashboard)();window.scrollTo(0,0);}

    case 'register-form':{if(data.password.length<8)throw Error('Use at least 8 characters for the demo password.');const s=D.fresh();s.company={name:data.name,email:data.email,phone:data.phone,categories:'both'};s.branches=[];s.team=[];s.purchases=[];s.allocations=[];s.services={};s.servicePayments=[];s.shipments=[];s.ledger=[];s.session=null;state=s;persist();go('login');toast('Company registered. Sign in to set up your company.');break;}
    case 'login-form':{if(data.password.length<8)throw Error('Use at least 8 characters for the demo password.');if(data.loginType.startsWith('branch:')){const id=data.loginType.slice(7);if(!state.branches.some(b=>b.id===id))throw Error('Branch not found.');state.session={role:'staff',branchId:id};}else state.session={role:data.loginType,branchId:state.branches[0]?.id||''};persist();go('dashboard');break;}
    case 'company-form':if(!own())throw Error('Company access required.');state.company={...state.company,...data};state.draft=null;persist();go('company');toast('Company settings saved for all branches.');break;
    case 'pack-form':{if(!own())throw Error('Company access required.');const count=+form.dataset.count;state.purchases.unshift({id:D.id('PLAN'),amount:count===10000?5000:1000,bookings:count,date:D.now(),kind:'booking-pack'});persist();go('subscription');toast('Demo quota added. No real payment.');break;}
    case 'branch-form':{if(!own())throw Error('Company access required.');const id=D.id('BR');if(!data.name||!data.city||!data.prefix||!data.pin)throw Error('Complete branch name, city and postal coverage.');if(state.branches.some(b=>b.name.toLowerCase()===data.name.toLowerCase()))throw Error('A branch with this name already exists.');const b={id,name:data.name,type:data.type,country:data.country,city:data.city,pin:data.pin,prefix:data.prefix,address:data.address};if(data.type==='franchise'&&(!Number.isSafeInteger(+data.bookings)||+data.bookings<0||!Number.isFinite(+data.amount)||+data.amount<0))throw Error('Enter valid initial bookings and commercial amount.');state.branches.push(b);if(b.type==='franchise'&&+data.bookings>0)D.allocate(state,{branchId:id,bookings:+data.bookings,amount:+data.amount,note:'Initial company-entered allowance'});persist();go('branch/'+id);toast('Branch created under '+state.company.name);break;}
    case 'allocation-form':D.allocate(state,{...data,branchId:form.dataset.branch});persist();go('branch/'+form.dataset.branch);toast('Allowance added. Company quota was not deducted.');break;
    case 'team-form':{if(!own())throw Error('Company access required.');if(data.password.length<8)throw Error('Use at least 8 characters.');if(data.role!=='superadmin'&&!data.branchId)throw Error('Branch admin / staff needs an assigned branch.');if(state.team.some(u=>u.email.toLowerCase()===data.email.toLowerCase()))throw Error('Email already exists in the demo team.');state.team.push({id:D.id('U'),name:data.name,email:data.email,role:data.role,branchId:data.role==='superadmin'?'':data.branchId});persist();go('team');toast('Demo account created.');break;}
    case 'service-purchase-form':{if(!own())throw Error('Company access required.');const p=D.providers.find(p=>p.id===form.dataset.provider);if(!state.services[p.id]?.paid){state.services[p.id]={...(state.services[p.id]||{}),paid:true,connected:false};state.servicePayments.unshift({providerId:p.id,amount:p.fee,date:D.now()});}persist();go('service/'+p.id+'/connect');toast('Demo service entitlement purchased. Connect the account next.');break;}
    case 'service-connect-form':{if(!own())throw Error('Company access required.');const id=form.dataset.provider;if(!state.services[id]?.paid)throw Error('Purchase the service entitlement first.');if(!data.account)throw Error('Enter a demo account label.');state.services[id]={...state.services[id],connected:true,account:data.account};persist();go(state.draft?.detailsComplete?'book/services':'services');toast('Demo service connected for company branches.');break;}
    case 'booking-details-form':{const d=state.draft;const origin=state.branches.find(b=>b.id===data.originId);if(!origin)throw Error('Choose an origin branch.');if(!D.categories(state).includes(data.category))throw Error('Company has not enabled this category.');if(data.category==='domestic'&&(data.country!=='India'||origin.country!=='India'))throw Error('Domestic demo route must be within India.');if(data.category==='international'&&data.country===origin.country)throw Error('International destination must be in a different country.');if(!own()&&data.originId!==state.session.branchId)throw Error('Use your assigned branch.');for(const k of ['quantity','weight','length','width','height','value'])data[k]=+data[k];if(Object.values(data).some(v=>typeof v==='string'&&!v))throw Error('Enter required details; blank spaces are not valid.');Object.assign(d,data,{detailsComplete:true,customsComplete:false,documents:false,service:null,providerRef:'',providerComplete:false});d.coverage=D.coverage(state,d);persist();go('book/coverage');break;}
    case 'courier-form':Object.assign(state.draft,data,{providerComplete:true});persist();go(state.draft.category==='international'?'book/customs':'book/review');break;
    case 'customs-form':if(!data.invoice||!/^\d{6,10}$/.test(data.hsCode))throw Error('Enter an invoice reference and valid HS code.');Object.assign(state.draft,data,{documents:true,customsComplete:true});persist();go('book/review');break;
    case 'review-form':{Object.assign(state.draft,{paymentType:data.paymentType,collectionMethod:data.collectionMethod,creditParty:data.creditParty||''});const booking=D.confirm(state,state.draft,data.outcome||'success');state.draft=null;persist();go('success/'+booking.id);break;}
    case 'reconcile-form':{const b=state.shipments.find(b=>b.id===form.dataset.id);D.reconcile(state,b,data.result);persist();go('shipment/'+b.id);toast(data.result==='confirmed'?'Provider confirmed. Count consumed.':'Failure confirmed. Pending hold released.');break;}
    case 'cancel-form':{const b=state.shipments.find(b=>b.id===form.dataset.id);D.cancel(state,b,data.result);persist();go('shipment/'+b.id);toast(data.result==='confirmed'?'Cancellation confirmed. Eligible count restored once.':data.result==='pending'?'Waiting for provider cancellation confirmation.':'Provider rejected cancellation. Booking remains active.');break;}
    case 'operation-form':{const b=state.shipments.find(b=>b.id===form.dataset.id);D.advance(state,b,data);persist();go('shipment/'+b.id);toast('Shipment updated: '+D.status(b));break;}
    case 'track-form':{const id=data.reference.toUpperCase().replace(/^(AWB|GRN|LR)[- /]*/,'CN-');const b=D.visible(state).find(b=>b.id.toUpperCase()===id);if(!b)throw Error('No matching shipment in this company / branch view.');go('shipment/'+b.id);break;}
    case 'report-filter-form':if(data.from&&data.to&&data.from>data.to)throw Error('From date must be before To date.');reportFilters=data;reportPage=1;reports(form.dataset.type);break;
  }}catch(err){error(err.message);}});

  document.addEventListener('change',e=>{const el=e.target;if(el.id==='role-switch'){const value=el.value;if(value.startsWith('branch:'))state.session={role:'staff',branchId:value.slice(7)};else state.session={role:value,branchId:state.branches[0]?.id||''};reportFilters={from:'',to:'',category:'all',mode:'all',branch:'all',search:''};reportPage=1;persist();go('dashboard');}if(el.name==='type'&&$('#franchise-fields'))$('#franchise-fields').hidden=el.value!=='franchise';if(el.name==='paymentType'&&$('#credit-party')){state.draft.paymentType=el.value;$('#credit-party').innerHTML=el.value==='Credit'?field('Credit party','creditParty',state.draft.creditParty):'';}if(el.id==='rate-sort'){rateSort=el.value;servicesPage();}if(el.id==='booking-status')filterBookings();if(el.name==='category'&&$('#booking-details-form')){const country=$('[name="country"]');if(el.value==='domestic')country.value='India';else if(country.value==='India')country.value='United Kingdom';}});
  function filterBookings(){const term=$('#booking-search').value.toLowerCase(),s=$('#booking-status').value;$('#booking-list').innerHTML=bookingsTable(D.visible(state).filter(b=>(s==='all'||D.status(b)===s)&&[b.id,b.city,b.receiver].join(' ').toLowerCase().includes(term)));}
  document.addEventListener('input',e=>{if(e.target.id==='booking-search')filterBookings();});
  document.addEventListener('click',e=>{try{const svc=e.target.closest('[data-select-service]');if(svc){state.draft.service=D.quotes(state,state.draft).find(s=>s.id===svc.dataset.selectService);state.draft.customsComplete=false;state.draft.providerComplete=false;persist();servicesPage();return;}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;const [name,arg]=action.split(':');if(name==='menu'){$('.sidebar').classList.add('open');$('.scrim').classList.add('open');}if(name==='close-menu'){$('.sidebar').classList.remove('open');$('.scrim').classList.remove('open');}if(name==='logout'){state.session=null;persist();go('login');}if(name==='reset'){state=D.seed();reportPage=1;reportFilters={from:'',to:'',category:'all',mode:'all',branch:'all',search:''};persist();go('dashboard');toast('Prepared demo restored.');}if(name==='viewbranch'){state.session={role:'staff',branchId:arg};persist();go('dashboard');}if(name==='discard'){state.draft=null;persist();go('dashboard');}if(name==='service-next'&&state.draft?.service){go(state.draft.service.id==='own'?(state.draft.category==='international'?'book/customs':'book/review'):'book/courier');}if(name==='sample'){if(!state.branches.length){go('book/new');return;}const d=D.makeDraft(state,own()?state.branches.find(b=>b.country==='India')?.id:state.session.branchId);d.category=arg.startsWith('international')?'international':'domestic';if(!D.categories(state).includes(d.category)){toast('Company has not enabled this category. Change company settings first.');return;}if(arg==='domestic-own'){const origin=state.branches.find(b=>b.id===d.originId);const destination=state.branches.find(b=>b.country==='India'&&b.id!==origin.id);if(destination)Object.assign(d,{city:destination.city,country:destination.country,pin:destination.pin,address:destination.address});}if(arg==='domestic-external')Object.assign(d,{country:'India',city:'Jaipur',pin:'302001',address:'18 MI Road'});if(arg==='international-own')Object.assign(d,{country:'United Arab Emirates',city:'Dubai',pin:'00000',address:'Al Quoz demo address'});if(arg==='international-external')Object.assign(d,{country:'United Kingdom',city:'London',pin:'SW1A 1AA',address:'12 Victoria Street'});state.draft=d;persist();go('book/details');}if(name==='advance-external'){const b=state.shipments.find(b=>b.id===arg);D.advance(state,b,{notes:'Simulated '+b.service.name+' tracking update'});persist();details(b);toast('Demo tracking updated.');}if(name==='refund'){if(!own())throw Error('Company access required.');const b=state.shipments.find(b=>b.id===arg);if(b.refund==='pending'){b.refund='completed';persist();details(b);toast('Demo refund marked complete. No real payment.');}}if(name==='download'){const b=D.visible(state).find(b=>b.id===arg);if(b)download(b);}if(name==='print')window.print();if(name==='export-report')exportReport(arg);if(name==='report-prev'){reportPage=Math.max(1,reportPage-1);reports(arg);}if(name==='report-next'){reportPage++;reports(arg);}if(name==='exhaust-company'){if(!own())throw Error('Switch to company view for this demo control.');const q=D.companyQuota(state);if(q.held)throw Error('Resolve pending provider confirmations before this demo control.');state.purchases=[{id:D.id('SIM'),amount:0,bookings:q.used,date:D.now(),kind:'simulated-exhaustion'}];persist();go('subscription');toast('Company quota is exhausted for testing. Restore demo to reset.');}if(name==='exhaust-franchise'){const b=D.branch(state);if(!b||b.type!=='franchise')throw Error('Switch View as to a franchise staff account first.');const q=D.branchQuota(state,b.id);if(q.held)throw Error('Resolve pending bookings first.');state.allocations=state.allocations.filter(a=>a.branchId!==b.id);if(q.used)state.allocations.push({id:D.id('SIM'),branchId:b.id,bookings:q.used,amount:0,note:'Demo exhaustion simulation',date:D.now()});persist();go('allowance');toast('Franchise allowance exhausted for testing.');}}catch(err){error(err.message);}});
  window.addEventListener('hashchange',()=>{try{render();}catch(err){console.error(err);$('#app').innerHTML=`<main class="login"><h1>Unable to open this demo page</h1><p class="subtitle">${esc(err.message)}</p><div class="buttonbar">${btn('Restore demo','reset')}${link('Dashboard','dashboard','secondary')}</div></main>`;}});
  window.CompanyDemoUI={getState:()=>state,reset:()=>{state=D.seed();persist();render();}};
  render();
})();
</script>
</body>
</html>
